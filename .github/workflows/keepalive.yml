name: Keepalive (prevent 60-day auto-disable)

on:
  schedule:
    - cron: '0 4 1,15 * *'  # 04:00 UTC on the 1st and 15th of every month
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Make keepalive commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          date -u +"Last keepalive: %Y-%m-%dT%H:%M:%SZ" > .keepalive
          git add .keepalive
          git commit -m "chore: keepalive (keep scheduled workflows enabled)" || echo "Nothing to commit"
          git push
